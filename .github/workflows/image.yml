name: Publish image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Careers/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dmitrypolon/careers:latest
      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT /user/packages/container/careers -f visibility=public
